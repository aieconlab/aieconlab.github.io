######################## default configuration ####################
baseURL = "https://www.aieconlab.com/"
title = "AIEconLab"
theme = "logbook-hugo"
# publish a project-controlled robots.txt (see layouts/robots.txt)
enableRobotsTXT = true
# post pagination
paginate = "4"
# post excerpt
summaryLength = "40"
# google analytics
googleAnalytics = "" # Ex: UA-123-45
# disqus short name
# disqusShortname = "themefisher-template" # get your shortname form here : https://disqus.com
# disable language
disableLanguages = ["fr"] # desable language from here

############################# Cascade ##############################
# Standalone HTML posts: every file under content/<lang>/post/html/ is a
# complete HTML document and is rendered as-is by
# layouts/_default/standalone.html instead of being wrapped in the theme.
# Front matter in each file still supplies title / date / author / taxonomies.
[[cascade]]
layout = "standalone"
[cascade._target]
path = "/post/html/**"

############################# Modules ##############################
[module]
[module.hugoVersion]
extended = true
# min = "0.89.4"

############################# Outputs ##############################
[outputs]
home = ["HTML", "RSS", "JSON", "WebAppManifest"]

############################# Imaging ##############################
[imaging]
# See https://github.com/disintegration/imaging
# Default JPEG or WebP quality setting. Default is 75.
quality = 90


############################# Caches ###############################
[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"

############################# Markup ###############################
[markup]
[markup.goldmark.renderer]
unsafe = true

# 취소선 확장 비활성화: 최신 goldmark(GFM)는 단일 물결표 쌍(예: "16~19세 ... 20~24세")도
# 취소선으로 해석해 범위 표기 사이에 줄이 그어진다. 이 사이트는 취소선(~~)을 쓰지 않으므로
# 끄는 것이 안전하며, Hugo 0.124(현 CI)와 이후 버전의 렌더 동작을 통일한다.
[markup.goldmark.extensions]
strikethrough = false

# math: protect LaTeX delimiters from markdown parsing (rendered by KaTeX on pages with `math: true`)
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]

[markup.highlight]
style = 'monokai' # see https://xyproto.github.io/splash/docs/all.html

############################ Media types ############################
[mediaTypes]
[mediaTypes."application/manifest+json"]
suffixes = ["webmanifest"]

[mediaTypes."text/netlify"]
delimiter = ""
suffixes = [""]


############################ Output Format ###########################
[outputFormats]
[outputFormats.WebAppManifest]
mediaType = "application/manifest+json"
rel = "manifest"
